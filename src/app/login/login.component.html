<div class="login-container" [attr.aria-busy]="isLoading ? 'true' : 'false'">
  <form (ngSubmit)="login()" class="login-form" #loginForm="ngForm">
    <img src="kimsa_black.png" alt="Logo" class="logo" />
    <h1>Iniciar Sesión</h1>

    <mat-form-field appearance="outline">
      <mat-label>Usuario</mat-label>
      <mat-icon matPrefix>person</mat-icon>
      <input matInput type="text" [(ngModel)]="usuario" name="usuario" required autocomplete="username" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contraseña</mat-label>
      <mat-icon matPrefix>lock</mat-icon>
      <input matInput [type]="hide ? 'password' : 'text'" [(ngModel)]="contrasena" name="contrasena" required
        autocomplete="current-password" />
      <button mat-icon-button matSuffix type="button" (click)="hide = !hide"
        [attr.aria-label]="hide ? 'Mostrar contraseña' : 'Ocultar contraseña'" class="toggle-password-btn">
        <mat-icon>{{ hide ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
    </mat-form-field>

    @if (error) {
    <div class="error-message">{{ error }}</div>
    }

    <button type="submit" class="login-btn" [disabled]="loginForm.invalid || isLoading">
      {{ isLoading ? 'Ingresando…' : 'Login' }}
    </button>
  </form>
</div>
